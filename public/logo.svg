<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E407C"/>
      <stop offset="1" stop-color="#16305E"/>
    </linearGradient>
  </defs>

  <!-- sfondo full-bleed (l'OS arrotonda per le icone 'any'; serve pieno per maskable) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- contenuto centrato nella safe zone (~80%): monogramma MI -->
  <text x="256" y="248"
        font-family="DejaVu Sans, Arial, Helvetica, sans-serif"
        font-size="210" font-weight="700"
        text-anchor="middle" dominant-baseline="middle"
        fill="#FFFFFF" letter-spacing="-6">MI</text>

  <!-- onda sotto: richiamo a misura/segnale -->
  <path d="M 140 360 Q 178 330 216 360 T 292 360 T 368 360"
        fill="none" stroke="#5AA0E6" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
